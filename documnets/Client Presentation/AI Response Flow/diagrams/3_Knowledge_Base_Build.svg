<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 1110 579" font-family="Lato, 'Noto Sans Devanagari', sans-serif" width="1110" height="579" preserveAspectRatio="xMidYMid meet"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="20" y="55" width="230" height="190" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="1.8"/><text x="135.0" y="125.1" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Your team&#x27;s files</text><text x="135.0" y="141.2" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">clinical sheets (Excel / CSV)</text><text x="135.0" y="156.6" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">Word documents</text><text x="135.0" y="172.0" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">therapist conversations</text><text x="135.0" y="187.3" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">self-care tools</text><rect x="300" y="55" width="230" height="190" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/><text x="415.0" y="125.1" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">1  Read and clean</text><text x="415.0" y="141.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">a reader for each file type;</text><text x="415.0" y="156.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">conversations are split into</text><text x="415.0" y="172.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">&quot;user said / therapist replied&quot;</text><text x="415.0" y="187.3" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">pairs; duplicates removed</text><rect x="580" y="55" width="230" height="190" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/><text x="695.0" y="125.1" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2  Safety gates</text><text x="695.0" y="141.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">held back, never used for a reply:</text><text x="695.0" y="156.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">crisis conversations, unfinished</text><text x="695.0" y="172.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">text, sensitive content on hold,</text><text x="695.0" y="187.3" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">one-word messages</text><rect x="860" y="55" width="230" height="190" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="975.0" y="123.9" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">3  Saved in the</text><text x="975.0" y="143.1" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">database (RDS)</text><text x="975.0" y="159.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">every row keeps its source file,</text><text x="975.0" y="174.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">author, tier and status</text><text x="975.0" y="188.9" font-size="11" text-anchor="middle"><tspan fill="#1d4ed8" font-weight="800">RDS</tspan></text><path d="M 250,150 L 300,150" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 530,150 L 580,150" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 810,150 L 860,150" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 975.0,245 L 975.0,315" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="860" y="315" width="230" height="190" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/><text x="975.0" y="368.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">4  Meaning vector</text><text x="975.0" y="387.7" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">added</text><text x="975.0" y="403.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">OpenAI turns each text into</text><text x="975.0" y="419.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">numbers capturing its meaning;</text><text x="975.0" y="434.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">saved beside the row with a</text><text x="975.0" y="449.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">fast search index</text><text x="975.0" y="464.2" font-size="11" text-anchor="middle"><tspan fill="#7e22ce" font-weight="800">VECTOR DB</tspan><tspan fill="#7e22ce" font-weight="400">  same database</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#0f766e" font-weight="800">AI</tspan><tspan fill="#0f766e" font-weight="400">  OpenAI</tspan></text><rect x="580" y="315" width="230" height="190" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="695.0" y="385.1" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">5  Approved for use</text><text x="695.0" y="401.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">only approved, eligible rows can</text><text x="695.0" y="416.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">ever be found by a search.</text><text x="695.0" y="432.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Today: only approved therapist</text><text x="695.0" y="447.3" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">replies are used</text><path d="M 860,410 L 810,410" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 580,410 L 530,410" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="300" y="315" width="230" height="190" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="415.0" y="389.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Result:</text><text x="415.0" y="408.2" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">a searchable</text><text x="415.0" y="427.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Knowledge Base</text><text x="415.0" y="443.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">ready for the live flow</text><text x="20" y="560" font-size="12" font-weight="800" fill="#1d4ed8">RDS</text><text x="50" y="560" font-size="12" fill="#334155">database tables</text><text x="184.0" y="560" font-size="12" font-weight="800" fill="#7e22ce">VECTOR DB</text><text x="262.0" y="560" font-size="12" fill="#334155">search by meaning</text><text x="410.4" y="560" font-size="12" font-weight="800" fill="#c2410c">REDIS</text><text x="456.4" y="560" font-size="12" fill="#334155">live memory</text><text x="561.5999999999999" y="560" font-size="12" font-weight="800" fill="#0f766e">AI</text><text x="583.5999999999999" y="560" font-size="12" fill="#334155">outside AI service</text><text x="20" y="598" font-size="12" font-weight="400" fill="#475569" text-anchor="start">Re-run whenever your team adds or changes files: it only adds what is new.</text></svg>