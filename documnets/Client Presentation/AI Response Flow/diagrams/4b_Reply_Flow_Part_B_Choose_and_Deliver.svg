<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 1110 746" font-family="Lato, 'Noto Sans Devanagari', sans-serif" width="1110" height="746" preserveAspectRatio="xMidYMid meet"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="20" y="50" width="190" height="85" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/><text x="115.0" y="83.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">From Part A</text><text x="115.0" y="99.1" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">message understood,</text><text x="115.0" y="114.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">no red flag found</text><polygon points="400,36.0 515.0,92 400,148.0 285.0,92" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="400" y="88.2" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">8  How close is the</text><text x="400" y="107.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">therapist match?</text><path d="M 210,92 L 285,92" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="20" y="215" width="220" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="130.0" y="246.3" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">STRONG</text><text x="130.0" y="265.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">The therapist&#x27;s reply,</text><text x="130.0" y="284.7" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">exactly as written</text><text x="130.0" y="300.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the AI language model is</text><text x="130.0" y="316.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">not used at all</text><rect x="270" y="215" width="300" height="140" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="420.0" y="251.2" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">PARTIAL</text><text x="420.0" y="270.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">AI rewords the therapists&#x27; replies</text><text x="420.0" y="286.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">sees a few close therapist examples and</text><text x="420.0" y="301.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">may add nothing new. If it drifts, the</text><text x="420.0" y="317.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">therapist&#x27;s original reply is sent instead.</text><text x="420.0" y="331.5" font-size="11" text-anchor="middle"><tspan fill="#0f766e" font-weight="800">AI</tspan><tspan fill="#0f766e" font-weight="400">  Sarvam language model</tspan></text><polygon points="830,219.0 950.0,285 830,351.0 710.0,285" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/><text x="830" y="271.6" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">NONE</text><text x="830" y="290.8" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">any other</text><text x="830" y="310.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">guidance found?</text><path d="M 400,148 L 400,185 L 130,185 L 130,215" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="265" y="177" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">strong</text><path d="M 400,148 L 400,215" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="455" y="203" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">partial</text><path d="M 400,148 L 400,185 L 830,185 L 830,219" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="700" y="177" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">none</text><rect x="555" y="420" width="250" height="125" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="680.0" y="456.3" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Therapist-written</text><text x="680.0" y="475.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">clarifying question</text><text x="680.0" y="491.7" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">no advice: &quot;tell me a little more&quot;.</text><text x="680.0" y="507.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Asked once; then the AI may answer.</text><text x="680.0" y="521.4" font-size="11" text-anchor="middle"><tspan fill="#7e22ce" font-weight="800">VECTOR DB</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  clarifying questions</tspan></text><rect x="840" y="420" width="250" height="140" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/><text x="965.0" y="456.2" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">AI writes a short,</text><text x="965.0" y="475.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">careful reply</text><text x="965.0" y="491.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">uses therapist self-care advice or</text><text x="965.0" y="506.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">guidance if found. Suggests a</text><text x="965.0" y="522.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">practitioner if unsure or serious.</text><text x="965.0" y="536.5" font-size="11" text-anchor="middle"><tspan fill="#7e22ce" font-weight="800">VECTOR DB</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  self-care</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#0f766e" font-weight="800">AI</tspan><tspan fill="#0f766e" font-weight="400">  language model</tspan></text><path d="M 830,351 L 830,388 L 680,388 L 680,420" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="755" y="380" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">nothing found</text><path d="M 830,351 L 830,388 L 965,388 L 965,420" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="905" y="380" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">found</text><path d="M 420,355 L 420,592 L 130,592" fill="none" stroke="#64748b" stroke-width="1.9"/><path d="M 680,545 L 680,592 L 420,592" fill="none" stroke="#64748b" stroke-width="1.9"/><path d="M 965,560 L 965,592 L 680,592" fill="none" stroke="#64748b" stroke-width="1.9"/><path d="M 130,335 L 130,628" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="20" y="628" width="270" height="92" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8"/><text x="155.0" y="647.9" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">9  Reply in the user&#x27;s</text><text x="155.0" y="667.1" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">own language</text><text x="155.0" y="683.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">fixed replies come from a</text><text x="155.0" y="698.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">pre-translated table: instant</text><text x="155.0" y="712.9" font-size="11" text-anchor="middle"><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  translations</tspan></text><rect x="320" y="628" width="230" height="92" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="1.8"/><text x="435.0" y="664.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">10  Reply is delivered</text><text x="435.0" y="680.6" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">streamed as text, or</text><text x="435.0" y="696.0" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">spoken aloud (voice)</text><rect x="580" y="628" width="270" height="92" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="715.0" y="657.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">11  Record the turn</text><text x="715.0" y="673.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">memory updated, plus an audit trail:</text><text x="715.0" y="688.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">which path answered, what matched</text><text x="715.0" y="703.3" font-size="11" text-anchor="middle"><tspan fill="#c2410c" font-weight="800">REDIS</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  audit log</tspan></text><path d="M 290,674 L 320,674" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 550,674 L 580,674" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="20" y="760" font-size="12" font-weight="800" fill="#1d4ed8">RDS</text><text x="50" y="760" font-size="12" fill="#334155">database tables</text><text x="184.0" y="760" font-size="12" font-weight="800" fill="#7e22ce">VECTOR DB</text><text x="262.0" y="760" font-size="12" fill="#334155">search by meaning</text><text x="410.4" y="760" font-size="12" font-weight="800" fill="#c2410c">REDIS</text><text x="456.4" y="760" font-size="12" fill="#334155">live memory</text><text x="561.5999999999999" y="760" font-size="12" font-weight="800" fill="#0f766e">AI</text><text x="583.5999999999999" y="760" font-size="12" fill="#334155">outside AI service</text></svg>