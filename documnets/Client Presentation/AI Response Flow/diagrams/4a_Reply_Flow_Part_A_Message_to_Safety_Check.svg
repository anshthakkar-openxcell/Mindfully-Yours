<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 1110 654" font-family="Lato, 'Noto Sans Devanagari', sans-serif" width="1110" height="654" preserveAspectRatio="xMidYMid meet"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="20" y="50" width="200" height="100" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="1.8"/><text x="120.0" y="80.9" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1  The user sends</text><text x="120.0" y="100.1" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">a message</text><text x="120.0" y="116.2" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">typed in the app, or spoken</text><text x="120.0" y="131.6" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">(voice becomes text first)</text><rect x="255" y="50" width="215" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/><text x="362.5" y="73.8" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2  Remember the</text><text x="362.5" y="93.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">conversation so far</text><text x="362.5" y="109.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">last few messages and the</text><text x="362.5" y="124.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">running severity score</text><text x="362.5" y="138.8" font-size="11" text-anchor="middle"><tspan fill="#c2410c" font-weight="800">REDIS</tspan><tspan fill="#c2410c" font-weight="400">  live memory</tspan></text><polygon points="590,40.0 685.0,100 590,160.0 495.0,100" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8"/><text x="590" y="96.2" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">3  Another</text><text x="590" y="115.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">language?</text><rect x="770" y="50" width="320" height="100" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/><text x="930.0" y="75.8" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">4  Make a &quot;meaning vector&quot;</text><text x="930.0" y="91.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the message turned into numbers that</text><text x="930.0" y="107.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">capture its meaning. Done once and</text><text x="930.0" y="122.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">reused by every step below.</text><text x="930.0" y="136.9" font-size="11" text-anchor="middle"><tspan fill="#0f766e" font-weight="800">AI</tspan><tspan fill="#0f766e" font-weight="400">  OpenAI embedding</tspan></text><rect x="500" y="205" width="180" height="100" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8"/><text x="590.0" y="238.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Translate to English</text><text x="590.0" y="254.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">so every step below</text><text x="590.0" y="269.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">understands the message</text><text x="590.0" y="284.2" font-size="11" text-anchor="middle"><tspan fill="#0f766e" font-weight="800">AI</tspan><tspan fill="#0f766e" font-weight="400">  Sarvam translation</tspan></text><path d="M 220,100 L 255,100" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 470,100 L 495,100" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 685,100 L 770,100" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="727" y="88" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">no</text><path d="M 590,160 L 590,205" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="612" y="188" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">yes</text><path d="M 680,255 L 930,255 L 930,150" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="770" y="345" width="320" height="105" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/><text x="930.0" y="371.3" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">6  Silent triage +</text><text x="930.0" y="390.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">severity score</text><text x="930.0" y="406.7" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">which signals and patterns are present?</text><text x="930.0" y="422.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">how serious has it been so far?</text><text x="930.0" y="436.3" font-size="11" text-anchor="middle"><tspan fill="#7e22ce" font-weight="800">VECTOR DB</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  signals, patterns, rules</tspan></text><path d="M 1010,150 L 1010,345" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="770" y="490" width="320" height="105" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="930.0" y="516.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">5  Look for a similar</text><text x="930.0" y="535.6" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">therapist conversation</text><text x="930.0" y="551.7" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">runs in the background while step 6</text><text x="930.0" y="567.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">runs; its result is used in Part B</text><text x="930.0" y="581.4" font-size="11" text-anchor="middle"><tspan fill="#7e22ce" font-weight="800">VECTOR DB</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  therapist conversations</tspan></text><path d="M 1090,100 L 1102,100 L 1102,542 L 1090,542" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><polygon points="590,327.0 695.0,397 590,467.0 485.0,397" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/><text x="590" y="383.6" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">7  SAFETY CHECK</text><text x="590" y="402.8" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">matches a</text><text x="590" y="422.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">red flag?</text><path d="M 770,397 L 695,397" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="180" y="335" width="270" height="125" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/><text x="315.0" y="371.3" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Approved safety script,</text><text x="315.0" y="390.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">word for word</text><text x="315.0" y="406.7" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">in the user&#x27;s own language.</text><text x="315.0" y="422.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">No AI writing. Flagged for follow-up.</text><text x="315.0" y="436.3" font-size="11" text-anchor="middle"><tspan fill="#7e22ce" font-weight="800">VECTOR DB</tspan><tspan fill="#94a3b8" font-weight="400">   ·   </tspan><tspan fill="#1d4ed8" font-weight="800">RDS</tspan><tspan fill="#1d4ed8" font-weight="400">  red flags + scripts</tspan></text><path d="M 485,397 L 450,397" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="467" y="386" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">yes</text><rect x="490" y="520" width="200" height="85" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/><text x="590.0" y="558.8" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">No red flag:</text><text x="590.0" y="578.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">continue to Part B</text><path d="M 590,467 L 590,520" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="610" y="497" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">no</text><text x="20" y="672" font-size="12" font-weight="800" fill="#1d4ed8">RDS</text><text x="50" y="672" font-size="12" fill="#334155">database tables</text><text x="184.0" y="672" font-size="12" font-weight="800" fill="#7e22ce">VECTOR DB</text><text x="262.0" y="672" font-size="12" fill="#334155">search by meaning</text><text x="410.4" y="672" font-size="12" font-weight="800" fill="#c2410c">REDIS</text><text x="456.4" y="672" font-size="12" fill="#334155">live memory</text><text x="561.5999999999999" y="672" font-size="12" font-weight="800" fill="#0f766e">AI</text><text x="583.5999999999999" y="672" font-size="12" fill="#334155">outside AI service</text></svg>