<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 1110 614" font-family="Lato, 'Noto Sans Devanagari', sans-serif" width="1110" height="614" preserveAspectRatio="xMidYMid meet"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="20" y="215" width="140" height="100" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="1.8"/><text x="90.0" y="255.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">The user</text><text x="90.0" y="271.6" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">on a phone or the web;</text><text x="90.0" y="287.0" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">types or speaks</text><rect x="190" y="55" width="275" height="395" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="8 6"/><text x="206" y="79" font-size="14" font-weight="800" fill="#0f172a">Apps and backend<tspan font-weight="400" font-size="12" fill="#475569">  (other team)</tspan></text><rect x="210" y="90" width="235" height="80" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/><text x="327.5" y="120.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Product backend</text><text x="327.5" y="136.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">NestJS: login, bookings,</text><text x="327.5" y="152.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">practitioner features</text><rect x="210" y="205" width="235" height="75" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/><text x="327.5" y="240.7" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Mobile + web app</text><text x="327.5" y="256.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Flutter / Next.js</text><rect x="210" y="330" width="235" height="90" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="327.5" y="373.2" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">LiveKit</text><text x="327.5" y="389.3" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">carries the live voice call</text><rect x="495" y="55" width="300" height="340" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="511" y="79" font-size="14" font-weight="800" fill="#0f172a">THE AI SERVICE<tspan font-weight="400" font-size="12" fill="#475569">  (Python / FastAPI)</tspan></text><rect x="515" y="100" width="260" height="95" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/><text x="645.0" y="138.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Safety check</text><text x="645.0" y="154.1" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">always first, on every message</text><text x="645.0" y="169.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">cannot be skipped</text><rect x="515" y="245" width="260" height="125" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="1.8"/><text x="645.0" y="290.3" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Response engine</text><text x="645.0" y="306.4" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">triage, therapist-conversation</text><text x="645.0" y="321.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">match, chooses where the</text><text x="645.0" y="337.1" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">reply comes from</text><rect x="835" y="55" width="255" height="340" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="851" y="79" font-size="14" font-weight="800" fill="#0f172a">YOUR DATA<tspan font-weight="400" font-size="12" fill="#475569">  (AWS Mumbai)</tspan></text><rect x="855" y="95" width="215" height="150" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/><text x="962.5" y="127.8" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">PostgreSQL database</text><text x="962.5" y="147.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">(RDS)</text><text x="962.5" y="163.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">with built-in vector search</text><text x="962.5" y="178.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">(pgvector): one database,</text><text x="962.5" y="193.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">two jobs. Knowledge Base,</text><text x="962.5" y="209.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">therapist conversations,</text><text x="962.5" y="224.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">safety rules, audit log</text><rect x="855" y="290" width="215" height="85" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="1.8"/><text x="962.5" y="323.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Redis</text><text x="962.5" y="339.1" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">live conversation memory,</text><text x="962.5" y="354.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">short-term reply cache</text><rect x="495" y="430" width="595" height="185" rx="18" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8"/><text x="511" y="454" font-size="14" font-weight="800" fill="#0f172a">OUTSIDE AI SERVICES<tspan font-weight="400" font-size="12" fill="#475569">  (swappable behind adapters)</tspan></text><rect x="515" y="470" width="265" height="120" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="1.8"/><text x="647.5" y="520.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Sarvam AI</text><text x="647.5" y="536.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">speech to text, text to speech,</text><text x="647.5" y="552.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the language model, translation</text><rect x="815" y="470" width="255" height="120" rx="14" fill="#ffffff" stroke="#a855f7" stroke-width="1.8"/><text x="942.5" y="520.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">OpenAI</text><text x="942.5" y="536.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">&quot;embeddings&quot;: turn text into</text><text x="942.5" y="552.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">meaning vectors for searching</text><path d="M 160,265 L 210,245" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M 327,205 L 327,170" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="338" y="192" font-size="11" font-weight="700" fill="#334155" text-anchor="start">messages, login</text><path d="M 327,280 L 327,330" fill="none" stroke="#64748b" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="338" y="310" font-size="11" font-weight="700" fill="#334155" text-anchor="start">voice</text><path d="M 445,130 L 515,140" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="480" y="126" font-size="12" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">text</text><path d="M 445,375 L 475,375 L 475,178 L 515,178" fill="none" stroke="#64748b" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="481" y="300" font-size="11" font-weight="700" fill="#334155" text-anchor="start">voice</text><path d="M 645,195 L 645,245" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><path d="M 775,150 L 855,150" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M 775,290 L 81