<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 565" font-family="Lato, 'Noto Sans Devanagari', sans-serif" width="1110" height="565" preserveAspectRatio="xMidYMid meet"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="20" y="30" width="250" height="125" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="1.8"/><text x="145.0" y="75.3" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">The user&#x27;s message</text><text x="145.0" y="91.4" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">&quot;I just moved to a new city</text><text x="145.0" y="106.8" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">for college and I feel so alone,</text><text x="145.0" y="122.1" font-size="12" font-weight="400" fill="#cbd5e1" text-anchor="middle">I don&#x27;t know anyone here&quot;</text><path d="M 145,155 L 145,215" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><rect x="20" y="215" width="250" height="150" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/><text x="145.0" y="248.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">1  Turn it into a</text><text x="145.0" y="267.7" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">meaning vector</text><text x="145.0" y="283.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">a long list of numbers that</text><text x="145.0" y="299.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">captures what it means.</text><text x="145.0" y="314.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Similar meanings give</text><text x="145.0" y="329.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">similar numbers.</text><text x="145.0" y="344.2" font-size="11" text-anchor="middle"><tspan fill="#0f766e" font-weight="800">AI</tspan><tspan fill="#0f766e" font-weight="400">  OpenAI embedding</tspan></text><rect x="305" y="20" width="545" height="505" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/><text x="321" y="44" font-size="14" font-weight="800" fill="#0f172a">ONE POSTGRESQL DATABASE (RDS)<tspan font-weight="400" font-size="12" fill="#475569">  with built-in vector search</tspan></text><text x="325" y="62" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="start">2  Vector search: the message&#x27;s vector is compared with the vector stored beside</text><text x="325" y="79" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="start">every row; the closest rows are picked (closer = more similar meaning).</text><rect x="325" y="100" width="505" height="36" rx="6" fill="#0f172a" stroke="none" stroke-width="1.4"/><text x="337" y="115" font-size="12" font-weight="800" fill="#ffffff" text-anchor="start">Therapist conversations table</text><text x="337" y="129" font-size="10.5" font-weight="400" fill="#cbd5e1" text-anchor="start">every conversation your therapists wrote</text><rect x="325" y="138" width="505" height="28" rx="0" fill="#e2e8f0" stroke="none" stroke-width="1.4"/><text x="337" y="157" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="start">What the user said</text><text x="517" y="157" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="start">Therapist&#x27;s reply</text><text x="702" y="157" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="start">Meaning vector</text><rect x="325" y="170" width="505" height="76" rx="0" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><rect x="690" y="170" width="140" height="76" rx="0" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/><text x="337" y="190.0" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">I miss my home, my family and</text><text x="337" y="204.3" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">my friends. I don&#x27;t know anyone</text><text x="337" y="218.6" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">in this city. It is so hard...</text><text x="517" y="190.0" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">It sounds like you feel homesick</text><text x="517" y="204.3" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">and lonely in the new place.</text><text x="517" y="218.6" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">How can I help you?</text><text x="702" y="192" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="start">close match</text><rect x="702" y="201" width="110" height="9" rx="4" fill="#e9d5ff" stroke="none" stroke-width="1.4"/><rect x="702" y="201" width="72.60000000000001" height="9" rx="4" fill="#a855f7" stroke="none" stroke-width="1.4"/><text x="702" y="226" font-size="10.5" font-weight="400" fill="#7e22ce" text-anchor="start">[ vector ]</text><text x="702" y="238" font-size="10" font-weight="400" fill="#475569" text-anchor="start">Homesickness</text><rect x="325" y="246" width="505" height="76" rx="0" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><rect x="690" y="246" width="140" height="76" rx="0" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/><text x="337" y="266.0" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">I&#x27;ve recently moved to a new city</text><text x="337" y="280.3" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">for work and I&#x27;m really struggling.</text><text x="337" y="294.6" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">I thought I&#x27;d be excited...</text><text x="517" y="266.0" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">hey thanks for sharing that. Can</text><text x="517" y="280.3" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">you tell me more about the</text><text x="517" y="294.6" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">hardest part for you so far?</text><text x="702" y="268" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="start">close match</text><rect x="702" y="277" width="110" height="9" rx="4" fill="#e9d5ff" stroke="none" stroke-width="1.4"/><rect x="702" y="277" width="72.60000000000001" height="9" rx="4" fill="#a855f7" stroke="none" stroke-width="1.4"/><text x="702" y="302" font-size="10.5" font-weight="400" fill="#7e22ce" text-anchor="start">[ vector ]</text><text x="702" y="314" font-size="10" font-weight="400" fill="#475569" text-anchor="start">Bipolar/transition issues</text><rect x="325" y="322" width="505" height="76" rx="0" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><rect x="690" y="322" width="140" height="76" rx="0" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/><text x="337" y="342.0" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">I moved here for university about</text><text x="337" y="356.3" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">three months ago. At first I was</text><text x="337" y="370.6" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">excited because it felt like...</text><text x="517" y="342.0" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">Looks like you&#x27;ve been feeling</text><text x="517" y="356.3" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">lonely, while at the same time you</text><text x="517" y="370.6" font-size="11" font-weight="400" fill="#0f172a" text-anchor="start">have been avoiding people. Would...</text><text x="702" y="344" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="start">close match</text><rect x="702" y="353" width="110" height="9" rx="4" fill="#e9d5ff" stroke="none" stroke-width="1.4"/><rect x="702" y="353" width="71.5" height="9" rx="4" fill="#a855f7" stroke="none" stroke-width="1.4"/><text x="702" y="378" font-size="10.5" font-weight="400" fill="#7e22ce" text-anchor="start">[ vector ]</text><text x="702" y="390" font-size="10" font-weight="400" fill="#475569" text-anchor="start">No friends</text><rect x="325" y="398" width="505" height="30" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="577" y="418" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">... many more rows, each with its own vector, ranked further away</text><text x="325" y="452" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">3  The same query returns the full text of those rows from the ordinary columns (RDS).</text><text x="325" y="469" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Text and vectors live in one table, so they can never fall out of step.</text><text x="325" y="498" font-size="12" font-weight="400" fill="#334155" text-anchor="start">Only rows that are approved and eligible are ever searched (see page 5).</text><rect x="885" y="110" width="205" height="290" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/><text x="987.5" y="159.1" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">4  The reply engine</text><text x="987.5" y="178.3" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">uses the closest rows</text><text x="987.5" y="194.4" font-size="12" font-weight="400" fill="#334155" text-anchor="middle"></text><text x="987.5" y="209.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Very close:</text><text x="987.5" y="225.1" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the top row&#x27;s reply is sent</text><text x="987.5" y="240.5" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">exactly as written</text><text x="987.5" y="255.8" font-size="12" font-weight="400" fill="#334155" text-anchor="middle"></text><text x="987.5" y="271.2" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Fairly close:</text><text x="987.5" y="286.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">a few rows are shown to</text><text x="987.5" y="301.9" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">the AI, which rewords them</text><text x="987.5" y="317.3" font-size="12" font-weight="400" fill="#334155" text-anchor="middle"></text><text x="987.5" y="332.6" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Not close:</text><text x="987.5" y="348.0" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">a clarifying question, or a</text><text x="987.5" y="363.4" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">short careful AI reply</text><path d="M 270,290 L 305,290" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="288" y="278" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">compare</text><path d="M 830,255 L 885,255" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ah)"/><text x="20" y="552" font-size="12" font-weight="800" fill="#1d4ed8">RDS</text><text x="50" y="552" font-size="12" fill="#334155">database tables</text><text x="184.0" y="552" font-size="12" font-weight="800" fill="#7e22ce">VECTOR DB</text><text x="262.0" y="552" font-size="12" fill="#334155">search by meaning</text><text x="410.4" y="552" font-size="12" font-weight="800" fill="#c2410c">REDIS</text><text x="456.4" y="552" font-size="12" fill="#334155">live memory</text></svg>